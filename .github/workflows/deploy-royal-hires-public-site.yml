name: Deploy Royal Hires Public Website

on:
  workflow_dispatch:
  push:
    branches: [feature/royal-pay-premium-dashboard]
    paths:
      - "website/**"
      - ".github/workflows/deploy-royal-hires-public-site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: royal-hires-public-site
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public website files only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            website
          sparse-checkout-cone-mode: true
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage static corporate website
        run: |
          mkdir -p _site
          cp -R website/. _site/
          touch _site/.nojekyll
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy static public website
        id: deployment
        uses: actions/deploy-pages@v4
