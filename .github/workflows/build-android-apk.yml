name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, fix/non-destructive-factory-init, feat/royal-pay-approved-auth]
  pull_request:
    branches: ['**']

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript validation
        run: npm run lint
      - name: Payroll, billing and invoicing unit checks
        run: npm run test:unit
      - name: Build web app
        run: npm run build
      - name: Generate Android project
        run: if [ -f android/gradlew ]; then echo "Android project exists; reusing it."; else echo "Incomplete Android project; regenerating in CI."; rm -rf android; npx cap add android; fi
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Configure Android OAuth deep link
        run: node scripts/configure-android-auth-deeplink.mjs
      - name: Apply Royal Hires launcher branding
        run: bash apply-android-brand-icons.sh
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug APK
        working-directory: android
        run: |
          test -f gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: royal-hires-payroll-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
